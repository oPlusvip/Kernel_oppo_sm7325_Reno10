name: Build KernelSU-Next Docker Kernel
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
    - cron: '0 12 * * 5'
    - cron: '0 12 * * 3'

# Upload Release 报 "Resource not accessible by integration"，是因为 fork 仓库的
# GITHUB_TOKEN 默认只读（本仓库 default_workflow_permissions=read），这里显式声明写权限。
permissions:
  contents: write

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Make Build Environment
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y kmod cpio binutils cmake binutils-aarch64-linux-gnu git wget pahole automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip dwarves device-tree-compiler python3 ccache git-lfs gnupg imagemagick libelf-dev libncurses5-dev libsdl1.2-dev gpart fuse2fs e2fsck-static icu-doc rsync adb fastboot libstdc++6 python-is-python3 gcc-aarch64-linux-gnu
          mkdir -p kernel

      - name: Checkout Kernel Source
        uses: actions/checkout@v6
        with:
          repository: miaizhe/Kernel_oppo_sm7325_Reno10
          path: kernel/msm-5.4
          fetch-depth: 1

      - name: Checkout Modules Source
        uses: actions/checkout@v6
        with:
          repository: oppo-source/android_kernel_modules_and_devicetree_oppo_sm7325
          path: temp_modules
          ref: oppo/sm7325_v_15.0.0_reno10

      - name: Prepare Compiler
        run: |
          mkdir -p compiler
          cd compiler
          curl -fL "https://github.com/Rancemxn/android_kernel_oppo_sm7325/releases/download/BuildTool/linux-x86-refs_heads_llvm-r383902b-clang-r383902.tar.gz" -o clang-r383902.tar.gz --connect-timeout 30 --retry 5 --retry-delay 5
          mkdir -p clang-bin
          tar -xzf clang-r383902.tar.gz -C clang-bin
          rm clang-r383902.tar.gz

      - name: Handle Dependencies
        run: |
          mv temp_modules/vendor ./vendor
          mv temp_modules/device ./device
          rm -rf temp_modules

      - name: Set Release Info & Custom Version
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: rekernel
        run: |
          cd kernel/msm-5.4
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_patches.sh" -o rekernel_patches.sh
          chmod +x rekernel_patches.sh
          bash rekernel_patches.sh
          mkdir -p drivers/rekernel
          curl https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/Rekernel/rekernel_extra.patch -o rekernel_extra.patch
          patch -p1 < rekernel_extra.patch || true

      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/compiler/clang-bin/bin:$PATH"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CLANG_PATH="$(pwd)/compiler/clang-bin/bin"
          export ARCH="arm64"
          export SUBARCH="arm64"

          cd kernel/msm-5.4

          echo "添加docker补丁中"
          rm fs/overlayfs/util.c
          curl -LSs "https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/util.c" -o fs/overlayfs/util.c
          rm kernel/module.c
          curl -LSs "https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/module.c" -o kernel/module.c
          rm arch/arm64/configs/Reno10-Docker_defconfig
          curl -LSs "https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/Reno10-Docker_defconfig" -o arch/arm64/configs/Reno10-Docker_defconfig
          rm include/linux/sched/user.h
          curl -LSs https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/refs/heads/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch -o 001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch
          curl -LSs https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/user.h -o include/linux/sched/user.h
          patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_3_4_5.patch
          echo "添加docker补丁完成"

          # ==== 接入 LZ4KD（华为）zram 压缩算法 ====
          # 关键：只往 drivers/block/zram/zcomp.c 的 backends[] 里加一项，绝不要整体覆盖 zcomp.c。
          # 这台机器开了 CONFIG_CONT_PTE_HUGEPAGE_64K_ZRAM，zram_drv.c 依赖
          # zcomp_compress_thp / zcomp_decompress_thp / zcomp_create_thp_zstrm_buffer，
          # 用 sm8250 的 zcomp.c 覆盖会直接链接失败（undefined reference），
          # 这正是之前 LZ4KD 版构建退出码 2、算法永远刷不进去的原因。
          echo "正在接入 LZ4KD 压缩算法..."
          LZ4KD_URL="https://raw.githubusercontent.com/liyafe1997/kernel_xiaomi_sm8250_mod/master"
          mkdir -p lib/lz4kd
          for f in Makefile lz4kd_encode.c lz4kd_decode.c lz4kd_private.h lz4kd_encode_private.h; do
            curl -fsSL "$LZ4KD_URL/lib/lz4kd/$f" -o "lib/lz4kd/$f" || { echo "::error::下载 lib/lz4kd/$f 失败"; exit 1; }
          done
          curl -fsSL "$LZ4KD_URL/include/linux/lz4kd.h" -o include/linux/lz4kd.h || { echo "::error::下载 include/linux/lz4kd.h 失败"; exit 1; }
          curl -fsSL "$LZ4KD_URL/crypto/lz4kd.c" -o crypto/lz4kd.c || { echo "::error::下载 crypto/lz4kd.c 失败"; exit 1; }
          grep -qm1 '^/\*' crypto/lz4kd.c || { echo "::error::crypto/lz4kd.c 内容异常"; exit 1; }
          grep -qm1 '^/\*' lib/lz4kd/lz4kd_encode.c || { echo "::error::lib/lz4kd/lz4kd_encode.c 内容异常"; exit 1; }

          # Makefile 注册（重复写入会重复编译，先判断）
          grep -q 'CONFIG_CRYPTO_LZ4KD' crypto/Makefile || echo 'obj-$(CONFIG_CRYPTO_LZ4KD) += lz4kd.o' >> crypto/Makefile
          grep -q 'CONFIG_LZ4KD_COMPRESS' lib/Makefile || echo 'obj-$(CONFIG_LZ4KD_COMPRESS) += lz4kd/' >> lib/Makefile
          grep -q 'CONFIG_LZ4KD_DECOMPRESS' lib/Makefile || echo 'obj-$(CONFIG_LZ4KD_DECOMPRESS) += lz4kd/' >> lib/Makefile

          # Kconfig 注册：crypto/Kconfig 末尾是 "endif # if CRYPTO"，
          # 直接追加会落到 if CRYPTO 外面，所以插到 config CRYPTO_LZ4HC 之前。
          if ! grep -q 'config CRYPTO_LZ4KD' crypto/Kconfig; then
            python3 - <<'PY'
          p = "crypto/Kconfig"
          s = open(p, encoding="utf-8").read()
          block = ("config CRYPTO_LZ4KD\n"
                   "\ttristate \"LZ4KD compression algorithm\"\n"
                   "\tselect CRYPTO_ALGAPI\n"
                   "\tselect LZ4KD_COMPRESS\n"
                   "\tselect LZ4KD_DECOMPRESS\n"
                   "\thelp\n"
                   "\t  This is the LZ4KD algorithm.\n\n")
          anchor = "config CRYPTO_LZ4HC\n"
          if anchor not in s:
              raise SystemExit("crypto/Kconfig: CRYPTO_LZ4HC not found")
          s = s.replace(anchor, block + anchor, 1)
          open(p, "w", encoding="utf-8").write(s)
          print("crypto/Kconfig: CRYPTO_LZ4KD inserted")
          PY
          fi
          if ! grep -q 'config LZ4KD_COMPRESS' lib/Kconfig; then
            printf 'config LZ4KD_COMPRESS\n\ttristate\n\nconfig LZ4KD_DECOMPRESS\n\ttristate\n' >> lib/Kconfig
          fi

          # 只给 zram 的 backends[] 增加 lz4kd，保留 OPPO 原本的 THP / hybridswap 实现
          if ! grep -q '"lz4kd"' drivers/block/zram/zcomp.c; then
            python3 - <<'PY'
          p = "drivers/block/zram/zcomp.c"
          s = open(p, encoding="utf-8").read()
          anchor = '#if IS_ENABLED(CONFIG_CRYPTO_LZ4HC)\n\t"lz4hc",\n#endif\n'
          if anchor not in s:
              raise SystemExit("zcomp.c: lz4hc backend block not found")
          s = s.replace(anchor, '#if IS_ENABLED(CONFIG_CRYPTO_LZ4KD)\n\t"lz4kd",\n#endif\n' + anchor, 1)
          open(p, "w", encoding="utf-8").write(s)
          print("zcomp.c: lz4kd backend registered")
          PY
          fi



          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.4.0-legacy
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh" -o syscall_hook_patches.sh
          chmod +x syscall_hook_patches.sh
          bash syscall_hook_patches.sh
          sed -i '/ksu_handle_devpts/d' drivers/tty/pty.c
          sed -i 's/obj-$(CONFIG_KPROBES)/obj-y/g' kernel/Makefile

          echo "正在用命令重构并清空报错的 selinux_hide.c..."
                              cat << 'EOF' > drivers/kernelsu/feature/selinux_hide.c
          #include <linux/types.h>
          #include <linux/kernel.h>
          void ksu_selinux_hide_init(void) { }
          void ksu_selinux_hide_exit(void) { }
          void ksu_selinux_hide_drop_backup_if_unused(void) { }
          void ksu_selinux_hide_handle_post_fs_data(void) { }
          void ksu_selinux_hide_handle_second_stage(void) { }
          EOF
          # 1. 生成默认配置
          make O=out CC="clang" LLVM=1 Reno10-Docker_defconfig

          # LZ4KD：必须写在 defconfig 之后，否则会被 defconfig 覆盖
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_LZ4KD

          # ==== 修复 TWRP 无法解密 data：恢复 Android FBE v2 密钥体系 ====
          echo "正在恢复 FBE v2 解密所需的内核密钥与加密功能..."
          ./scripts/config --file out/.config --enable CONFIG_KEYS
          ./scripts/config --file out/.config --enable CONFIG_KEYS_COMPAT
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_HMAC
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_SHA512
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_CTS
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_AES
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_XTS
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_CBC
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_ECB
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_CTR
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_SHA256
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_SHA1
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_AES_ARM64_CE
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_SHA256_ARM64
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_CRYPTD
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_GCM
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_GHASH
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_ESSIV
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_CCM
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_CMAC
          ./scripts/config --file out/.config --enable CONFIG_CRYPTO_DRBG

          # ==== 开启 KVM 虚拟化（验证 EL2 归属）====
          ./scripts/config --file out/.config --enable CONFIG_VIRTUALIZATION
          ./scripts/config --file out/.config --enable CONFIG_KVM

          # 2. 注入 Kali NetHunter 所需功能
          echo "正在注入 Kali NetHunter 所需功能..."
          # --- Chroot 支持 ---
          ./scripts/config --file out/.config --enable CONFIG_NAMESPACES
          ./scripts/config --file out/.config --enable CONFIG_UTS_NS
          ./scripts/config --file out/.config --enable CONFIG_IPC_NS
          ./scripts/config --file out/.config --enable CONFIG_PID_NS
          ./scripts/config --file out/.config --enable CONFIG_NET_NS
          ./scripts/config --file out/.config --enable CONFIG_DEVPTS_MULTIPLE_INSTANCES

          # --- USB Gadget / HID 攻击支持 (BadUSB) ---
          ./scripts/config --file out/.config --enable CONFIG_USB_GADGET
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_F_HID
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_F_FS

          # --- WiFi 监听与注入模式支持 ---
          ./scripts/config --file out/.config --enable CONFIG_CFG80211
          ./scripts/config --file out/.config --enable CONFIG_MAC80211
          ./scripts/config --file out/.config --enable CONFIG_MAC80211_MESH

          # --- 文件系统支持 ---
          ./scripts/config --file out/.config --enable CONFIG_SQUASHFS
          ./scripts/config --file out/.config --enable CONFIG_SQUASHFS_XATTR
          ./scripts/config --file out/.config --enable CONFIG_SQUASHFS_ZLIB

          # --- 网络过滤 ---
          ./scripts/config --file out/.config --enable CONFIG_NETFILTER
          ./scripts/config --file out/.config --enable CONFIG_NF_NAT

          # 3. 开始原有的 Docker 配置修改
          echo "正在应用原有的 Docker 相关配置..."
          ./scripts/config --file out/.config \
            -d CONFIG_KSU_TRACEPOINT_HOOK \
            -e CONFIG_KSU_MANUAL_HOOK

          # ==== Enable namespaces for Droidspaces ====
          ./scripts/config --file out/.config \
            -e CONFIG_USER_NS \
            -e CONFIG_PID_NS \
            -e CONFIG_IPC_NS \
            -e CONFIG_CHECKPOINT_RESTORE \
            -e CONFIG_SYSVIPC \
            -e CONFIG_KPROBES \
            -e CONFIG_TMPFS_POSIX_ACL \
            -e CONFIG_TMPFS_XATTR

          ./scripts/config --file out/.config --enable CONFIG_CGROUP_PIDS
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_IO
          ./scripts/config --file out/.config --enable CONFIG_CPUSETS
          ./scripts/config --file out/.config --enable CONFIG_MEMCG
          ./scripts/config --file out/.config --enable CONFIG_DEVTMPFS
          ./scripts/config --file out/.config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS

          # --- 补充 NetHunter Full 所需功能 ---
          # USB 全功能 (ADB/串口/ECM/NCM/RNDIS/DWC3)
          ./scripts/config --file out/.config --enable CONFIG_USB_ACM
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_ACM
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_SERIAL
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_ECM
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_NCM
          ./scripts/config --file out/.config --enable CONFIG_USB_CONFIGFS_RNDIS
          ./scripts/config --file out/.config --enable CONFIG_USB_DWC3

          # NAT / 转发
          ./scripts/config --file out/.config --enable CONFIG_NF_CONNTRACK
          ./scripts/config --file out/.config --enable CONFIG_NF_CONNTRACK_IPV4
          ./scripts/config --file out/.config --enable CONFIG_NETFILTER_XTABLES
          ./scripts/config --file out/.config --enable CONFIG_IP_NF_IPTABLES
          ./scripts/config --file out/.config --enable CONFIG_IP_NF_FILTER
          ./scripts/config --file out/.config --enable CONFIG_IP_NF_NAT
          ./scripts/config --file out/.config --enable CONFIG_IP_NF_TARGET_MASQUERADE
          ./scripts/config --file out/.config --enable CONFIG_NF_NAT_MASQUERADE
          ./scripts/config --file out/.config --enable CONFIG_IP_ADVANCED_ROUTER
          ./scripts/config --file out/.config --enable CONFIG_IP_ROUTE_MULTIPATH
          # 桥接
          ./scripts/config --file out/.config --enable CONFIG_BRIDGE
          ./scripts/config --file out/.config --enable CONFIG_BRIDGE_NETFILTER


          # 模块加载
          ./scripts/config --file out/.config --enable CONFIG_MODULES
          ./scripts/config --file out/.config --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --file out/.config --enable CONFIG_FW_LOADER

          # Cgroup 完整
          ./scripts/config --file out/.config --enable CONFIG_CGROUPS

          # 抓包
          ./scripts/config --file out/.config --enable CONFIG_PACKET

          # --- 无线框架补充 (WLAN 监听前置) ---
          ./scripts/config --file out/.config --enable CONFIG_WIRELESS
          ./scripts/config --file out/.config --enable CONFIG_WIRELESS_EXT
          ./scripts/config --file out/.config --enable CONFIG_NL80211_TESTMODE

          # --- 路由与 QoS (流量整形/抓包辅助) ---
          ./scripts/config --file out/.config --enable CONFIG_IP_ADVANCED_ROUTER
          ./scripts/config --file out/.config --enable CONFIG_NET_SCHED

          # --- IPv6 NAT 全链路 (渗透测试常需 IPv6) ---
          ./scripts/config --file out/.config --enable CONFIG_IPV6
          ./scripts/config --file out/.config --enable CONFIG_NF_CONNTRACK_IPV6
          ./scripts/config --file out/.config --enable CONFIG_NF_NAT_IPV6
          ./scripts/config --file out/.config --enable CONFIG_IP6_NF_IPTABLES
          ./scripts/config --file out/.config --enable CONFIG_IP6_NF_FILTER
          ./scripts/config --file out/.config --enable CONFIG_IP6_NF_NAT
          ./scripts/config --file out/.config --enable CONFIG_IP6_NF_TARGET_MASQUERADE

          # --- nftables 核心 (Kali 新版默认防火墙/流量控制) ---
          ./scripts/config --file out/.config --enable CONFIG_NF_TABLES
          ./scripts/config --file out/.config --enable CONFIG_NF_TABLES_IPV4
          ./scripts/config --file out/.config --enable CONFIG_NF_TABLES_IPV6
          ./scripts/config --file out/.config --enable CONFIG_NF_TABLES_INET
          ./scripts/config --file out/.config --enable CONFIG_NF_TABLES_NETDEV
          ./scripts/config --file out/.config --enable CONFIG_NFT_CT
          ./scripts/config --file out/.config --enable CONFIG_NFT_NAT
          ./scripts/config --file out/.config --enable CONFIG_NFT_MASQ
          ./scripts/config --file out/.config --enable CONFIG_NFT_REDIR
          ./scripts/config --file out/.config --enable CONFIG_NFT_COUNTER
          ./scripts/config --file out/.config --enable CONFIG_NFT_LOG
          ./scripts/config --file out/.config --enable CONFIG_NFT_LIMIT

          # --- 流量标记 MANGLE / MARK (部分攻击工具依赖) ---
          ./scripts/config --file out/.config --enable CONFIG_IP_NF_MANGLE
          ./scripts/config --file out/.config --enable CONFIG_NETFILTER_XT_TARGET_MARK
        
          # --- 文件系统补充 (挂载 Kali ISO / F2FS) ---
          ./scripts/config --file out/.config --enable CONFIG_ISO9660_FS
          ./scripts/config --file out/.config --enable CONFIG_UDF_FS
          ./scripts/config --file out/.config --enable CONFIG_F2FS_FS

          # --- 蓝牙子系统 & VHCI 支持 (修复 BlueBinder /dev/vhci 缺失) ---
          ./scripts/config --file out/.config --enable CONFIG_BT
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIVHCI
          ./scripts/config --file out/.config --enable CONFIG_BT_BREDR
          ./scripts/config --file out/.config --enable CONFIG_BT_LE
          ./scripts/config --file out/.config --enable CONFIG_BT_RFCOMM
          ./scripts/config --file out/.config --enable CONFIG_BT_HIDP
          # 串口蓝牙驱动
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIUART
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIUART_H4
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIUART_LL
          # USB 蓝牙驱动 (兼容外接)
          ./scripts/config --file out/.config --enable CONFIG_BT_HCIBTUSB

          # 4. 开始编译
          make O=out CC="clang" LLVM=1 -j$(nproc)

          # ==== 编译后校验 LZ4KD 是否真的进了内核 ====
          grep -q '^#define CONFIG_CRYPTO_LZ4KD 1' out/include/generated/autoconf.h \
            || { echo "::error::CONFIG_CRYPTO_LZ4KD 没有生效（被 Kconfig 依赖裁掉）"; grep -n LZ4KD out/.config || true; exit 1; }
          echo "LZ4KD 自检："
          echo "  zcomp.o 里 lz4kd 出现次数: $(grep -ac 'lz4kd' out/drivers/block/zram/zcomp.o 2>/dev/null || true)"
          echo "  Image   里 lz4kd 出现次数: $(grep -ac 'lz4kd' out/arch/arm64/boot/Image 2>/dev/null || true)"
          ls -l out/drivers/block/zram/ 2>/dev/null | head -8 || true
          grep -aq 'lz4kd' out/arch/arm64/boot/Image || echo "::warning::Image 里没搜到 lz4kd 字符串（需人工确认）"
          echo "LZ4KD 已编入内核，刷入后可执行：echo lz4kd > /sys/block/zram0/comp_algorithm"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i '584s|ui_print " " "Done!";|ui_print " "; ui_print "感谢支持芜夕wuxi内核，刷入完成！"; ui_print "祝你玩的愉快！";|' AnyKernel3/META-INF/com/google/android/update-binary
          cp kernel/msm-5.4/out/arch/arm64/boot/Image AnyKernel3/
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find kernel/msm-5.4/out/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;
          cd AnyKernel3
          rm anykernel.sh
          wget https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/anykernel.sh
          zip -r9 ../KernelSU-Next-Reno10-Docker-${{ env.BUILD_DATE }}.zip * -x .git* README.md *placeholder

      - name: Pack Boot Image
        run: |
          pwd
          mkdir -p boot_pack
          cd boot_pack
          wget https://raw.githubusercontent.com/miaizhe/magiskboot-linux/refs/heads/main/x86_64/magiskboot
          chmod +x magiskboot
          curl -fL "https://github.com/miaizhe/twrp_device_oppo_taylor/releases/download/TWRP/twrp-3.7.1_12-0-Reno10.img" -o boot_origin.img
          ./magiskboot unpack boot_origin.img
          if [ ! -f "../kernel/msm-5.4/out/arch/arm64/boot/Image" ]; then
            echo "错误：编译出的 Image 文件不存在，请检查编译步骤！"
            exit 1
          fi
          cp ../kernel/msm-5.4/out/arch/arm64/boot/Image kernel
          ./magiskboot repack boot_origin.img ../boot-KernelSU-Next-Reno10-Docker-${{ env.BUILD_DATE }}.img
          pwd
          cd ..
          pwd

      - name: Pack WithoutTWRP Boot Image
        run: |
          pwd
          mkdir -p boot_pack
          cd boot_pack
          wget https://raw.githubusercontent.com/miaizhe/magiskboot-linux/refs/heads/main/x86_64/magiskboot
          chmod +x magiskboot
          curl -fL "https://github.com/miaizhe/Kernel_oppo_sm7325_Reno10/releases/download/boot/boot_a.img" -o boot_origin.img
          ./magiskboot unpack boot_origin.img
          if [ ! -f "../kernel/msm-5.4/out/arch/arm64/boot/Image" ]; then
            echo "错误：编译出的 Image 文件不存在，请检查编译步骤！"
            exit 1
          fi
          cp ../kernel/msm-5.4/out/arch/arm64/boot/Image kernel
          ./magiskboot repack boot_origin.img ../boot-KernelSU_Next-Reno10-WithoutTWRP-Docker-${{ env.BUILD_DATE }}.img
          pwd
          cd ..
          pwd

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v6
        with:
          name: ReSukiSU_Reno10_Docker.img
          path: |
            boot-KernelSU-Next-Reno10-Docker-${{ env.BUILD_DATE }}.img
            boot-KernelSU_Next-Reno10-WithoutTWRP-Docker-${{ env.BUILD_DATE }}.img
            KernelSU-Next-Reno10-Docker-${{ env.BUILD_DATE }}.zip

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_DATE }}
          name: KernelSU Kernel for Reno10 (${{ env.BUILD_DATE }})
          body: |
            - 编译日期: ${{ env.BUILD_DATE }}
            - 核心版本: 5.4.254
            - 包含功能: ReSukiSU,KernelSU-Next
            - 欢迎刷入芜夕wuxi的内核！祝你玩的愉快！
            - 文件：分为带SuSFS的和不带SukiSU的，zip为ak3包，img文件为打包好的镜像，Docker为带Docker的,test为测试版
          files: |
            KernelSU-Next-Reno10-Docker-${{ env.BUILD_DATE }}.zip
            boot-KernelSU-Next-Reno10-Docker-${{ env.BUILD_DATE }}.img
            boot-KernelSU_Next-Reno10-WithoutTWRP-Docker-${{ env.BUILD_DATE }}.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
